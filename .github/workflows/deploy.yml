# Builds the game and publishes it to GitHub Pages on every push to main
# (or when run by hand from the Actions tab). The site is served at
# https://<user>.github.io/penrose-puzzle/ from the root of the gh-pages
# branch, so the build gets BASE_PATH=/penrose-puzzle/.
#
# One-time setup, after the first run has created the gh-pages branch:
# repository Settings -> Pages -> Build and deployment ->
# Source: "Deploy from a branch", branch gh-pages, folder / (root).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One deploy at a time; a newer push replaces a queued one
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Don't publish if a rule test fails
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # Serve the files as they are, without Jekyll processing
      - run: touch dist/.nojekyll
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
