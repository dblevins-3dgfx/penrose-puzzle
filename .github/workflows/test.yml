# Checks every pull request: the type checker, the linter, the unit tests,
# and the production build. (Pushes to main are tested by deploy.yml before it
# publishes.)
name: Test

on:
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request cancels the older run
concurrency:
  group: test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
